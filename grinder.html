<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ead8c4">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>クリック比較表 | Brew Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./theme.css?v=30">
<style>
.grinderWrap{width:min(100%,680px);margin:auto;padding:18px 12px 24px}
.back{display:inline-flex;align-items:center;gap:5px;color:#684b39;text-decoration:none;font-size:12px;font-weight:600;padding:8px 3px}
.grinderHead{margin:7px 0 12px}
.grinderEyebrow{font-size:11px;color:var(--muted);margin:0 0 4px}
.grinderTitle{font-family:var(--serif);font-size:28px;line-height:1.25;margin:0;color:var(--deep);letter-spacing:.01em}
.grinderLead{font-size:11.5px;color:var(--muted);line-height:1.7;margin:7px 0 0}
.grinderCard{background:rgba(255,250,243,.96);border:1px solid rgba(255,255,255,.78);border-radius:20px;box-shadow:var(--shadow);padding:12px;margin-top:10px}
.tableWrap{overflow:hidden;border-radius:15px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{padding:13px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{background:#f0dfcf;color:#5d402f;font-size:11px;font-weight:600;line-height:1.45}
td{background:#fffaf4;color:var(--deep);font-family:var(--serif);font-size:12px;font-weight:600}
th:first-child,td:first-child{width:25%;font-family:var(--sans);font-weight:600}
tr:last-child td{border-bottom:0}
.grinderFooter{margin-top:12px;border-radius:19px;overflow:hidden;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.72)}
.grinderFooter img{display:block;width:100%;height:auto}
@media(max-width:430px){
  .grinderWrap{padding:13px 10px 20px}
  .grinderTitle{font-size:25px}
  .grinderCard{padding:9px;border-radius:18px}
  .tableWrap{border-radius:13px}
  th,td{padding:11px 3px;font-size:10.8px}
  .grinderFooter{border-radius:17px}
}
</style>
</head>
<body>
<main class="grinderWrap">
  <a class="back" href="./">← Brew Guideに戻る</a>
  <header class="grinderHead">
    <p class="grinderEyebrow">グラインダー挽き目比較</p>
    <h1 class="grinderTitle">コマンダンテ / TIMEMORE C2</h1>
    <p class="grinderLead">コマンダンテ C40 MK4 の推奨クリック数を、TIMEMORE C2で使うときの目安として確認できます。</p>
  </header>
  <section class="grinderCard">
    <div class="tableWrap">
      <table>
        <thead>
          <tr><th>挽き目</th><th>コマンダンテ<br>C40 MK4</th><th>TIMEMORE<br>C2</th></tr>
        </thead>
        <tbody>
          <tr><td>細挽き</td><td>17〜18クリック</td><td>15〜16クリック</td></tr>
          <tr><td>中細挽き</td><td>19〜21クリック</td><td>17〜18クリック</td></tr>
          <tr><td>中挽き</td><td>22〜24クリック</td><td>19〜21クリック</td></tr>
          <tr><td>中粗挽き</td><td>25〜28クリック</td><td>22〜29クリック</td></tr>
          <tr><td>粗挽き</td><td>29〜30クリック</td><td>30〜31クリック</td></tr>
        </tbody>
      </table>
    </div>
  </section>
  <footer class="grinderFooter"><img src="./footer-banner.webp?v=30" alt="ハンドドリップガイド Brew Guide"></footer>
</main>
</body>
</html>
