<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ead9c7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Brew Guide">
<title>Brew Guide</title>
<link rel="manifest" href="manifest.webmanifest?v=4">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=4">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="./apple-touch-icon.png?v=4">
<style>
:root{--bg:#ead9c7;--panel:#fff9f2;--panel2:#f4e6d8;--ink:#3a2418;--muted:#7a6253;--line:#d4bda9;--accent:#6f4e37;--accent-dark:#4b2f22;--cream:#fffdf9;--radius:15px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.38}
button,input{font:inherit}button{cursor:pointer}
.wrap{width:min(100%,680px);margin:0 auto;padding:8px 12px 22px}
.hero{display:flex;flex-direction:column;align-items:stretch;padding:4px 4px 0}
.heroText{text-align:left;position:relative;z-index:3}.heroArt{display:block;width:min(55vw,215px);height:auto;object-fit:contain;margin:2px auto -18px;position:relative;z-index:2;filter:drop-shadow(0 5px 4px rgba(75,47,34,.07))}
.title{font-size:27px;font-weight:800;margin:0;color:var(--accent-dark);letter-spacing:.01em}.sub{font-size:12px;color:var(--muted);margin:2px 0 0}
.hero + .section{margin-top:0;padding-top:14px}.section,.timer,details{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:11px}
.section h2{font-size:14px;margin:0 0 7px;color:var(--accent-dark)}.hint{font-size:10.5px;color:var(--muted);margin:5px 0 0}
.grid3,.tasteRow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.choice{min-height:46px;border:1px solid var(--line);background:var(--cream);border-radius:11px;padding:6px;color:var(--ink)}.choice.active{background:var(--accent);color:#fff;border-color:var(--accent)}.choice.active small{color:#f2e8df}.choice strong{font-size:16px;display:block}.choice small{display:block;font-size:10px;color:var(--muted);margin-top:1px}
.roast strong{font-size:12px}.roast .temp{font-size:17px;font-weight:800;display:block;line-height:1.1;margin-top:2px}.grindSection{display:flex;align-items:center;gap:12px}.grindSection h2{margin:0;white-space:nowrap}.grindText{font-size:11.5px;color:var(--muted);margin:0;white-space:nowrap}
.rangeBox{margin-top:7px;border:1px solid var(--line);border-radius:11px;padding:8px 9px;background:#fffaf5}.rangeTop{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px}input[type=range]{width:100%;accent-color:var(--accent);margin:7px 0 1px}.rangeHint{font-size:10.5px;color:var(--muted);margin:1px 0 0;text-align:center}
.recipeHead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:0}.recipeHead h2{margin:0}.recipeMeta{font-weight:800;font-size:17px;color:var(--accent-dark);white-space:nowrap}
.timerTop{display:flex;justify-content:space-between;align-items:center;gap:10px}.timerTop b{font-size:14px}.clock{font-size:27px;font-weight:800;color:var(--accent-dark);font-variant-numeric:tabular-nums}
.timerCard{margin-top:6px;background:var(--panel2);border-radius:11px;padding:12px 10px 13px;text-align:center;transition:background .22s ease,color .22s ease,transform .22s ease;overflow:hidden}
.pourDots{display:flex;justify-content:center;gap:9px;margin-bottom:9px}.pourDot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;transition:transform .2s ease,background .2s ease,border-color .2s ease}.pourDot.done,.pourDot.current{background:var(--accent)}.pourDot.current{transform:scale(1.35)}
.timerMain{display:flex;justify-content:center;align-items:center;gap:12px}.stepBadge{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--accent);font-size:19px;font-weight:800;color:var(--accent-dark);background:var(--cream);transition:transform .2s ease,background .2s ease,color .2s ease,border-color .2s ease}.timerAmount{font-size:27px;font-weight:800;color:var(--accent-dark);font-variant-numeric:tabular-nums;transition:color .2s ease}
.timerCard.alert{background:var(--accent);color:#fff;transform:scale(1.015)}.timerCard.alert .pourDot{border-color:#fff}.timerCard.alert .pourDot.done,.timerCard.alert .pourDot.current{background:#fff}.timerCard.alert .stepBadge{background:#fff;color:var(--accent-dark);border-color:#fff;animation:stepPop .65s ease}.timerCard.alert .timerAmount{color:#fff}
@keyframes stepPop{0%{transform:scale(.75)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
.actions{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}.actions button{min-height:40px;border-radius:11px;border:1px solid var(--line);background:var(--cream);color:var(--ink);padding:0 11px;font-weight:700}.actions .primary{flex:1;background:var(--accent);color:#fff;border-color:var(--accent)}
details{padding:10px 11px}summary{font-weight:700;font-size:13px;color:var(--accent-dark);cursor:pointer}.detailsBody{font-size:11px;color:var(--muted);margin-top:6px}.detailsBody p{margin:5px 0}
@media(max-width:430px){
 .wrap{padding:5px 10px 14px}
 .hero{display:grid;grid-template-columns:1fr 160px;align-items:center;min-height:112px;padding:0 6px;position:relative;z-index:3;overflow:visible}
 .heroText{align-self:center}.heroArt{position:absolute;right:0;bottom:-24px;width:164px;max-height:150px;margin:0;object-fit:contain;z-index:4}
 .title{font-size:24px}.sub{font-size:11px;margin-top:1px}
 .hero + .section{margin-top:0;padding-top:9px;position:relative;z-index:1}
 .section,.timer,details{margin-top:5px;padding:8px 9px;border-radius:13px}
 .section h2{font-size:13px;margin:0 0 5px}
 .grid3,.tasteRow{gap:5px}
 .choice{min-height:40px;border-radius:9px;padding:4px 4px}
 .choice strong{font-size:15px}.choice small{font-size:9px;margin-top:0}
 .roast strong{font-size:11px}.roast .temp{font-size:15.5px;margin-top:1px}
 .grindSection{gap:8px;min-height:40px}.grindSection h2{margin:0}.grindText{font-size:9.8px}
 .rangeBox{margin-top:5px;border-radius:9px;padding:6px 7px}.rangeTop{font-size:11px}input[type=range]{margin:5px 0 0}.rangeHint{display:none}
 .recipeMeta{font-size:15.5px}.recipeHead{align-items:center}.recipeHead h2{margin:0}
 .timerTop b{font-size:13px}.clock{font-size:24px}
 .timerCard{margin-top:5px;border-radius:9px;padding:8px 8px 9px}
 .pourDots{gap:7px;margin-bottom:6px}.pourDot{width:8px;height:8px}
 .timerMain{gap:9px}.stepBadge{width:34px;height:34px;font-size:17px}.timerAmount{font-size:24px}
 .actions{gap:5px;margin-top:5px;flex-wrap:nowrap}.actions button{min-height:36px;border-radius:9px;padding:0 8px;font-size:12.5px}.actions .primary{min-width:0}
 details{padding:8px 9px}summary{font-size:12px}.detailsBody{font-size:10px;margin-top:4px}
}
@media(max-width:360px){.title{font-size:21px}.hero{grid-template-columns:1fr 138px;min-height:102px}.heroArt{width:148px;max-height:136px;right:-2px;bottom:-20px}.choice{padding:3px 2px}.recipeMeta{font-size:14px}.grindText{font-size:8.8px}}
</style>
</head>
<body>
<main class="wrap">
<header class="hero">
<div class="heroText"><h1 class="title">Brew Guide</h1><p class="sub">4：6メソッド専用</p></div>
<img class="heroArt" src="./penguin-hero-transparent.png?v=2" alt="ペンギンが手淹れコーヒーを淹れているイラスト">
</header>

<section class="section">
<h2>豆量</h2>
<div class="grid3" id="beanChoices">
<button class="choice active" data-beans="15"><strong>15g</strong><small>225g</small></button>
<button class="choice" data-beans="20"><strong>20g</strong><small>300g</small></button>
<button class="choice" data-beans="30"><strong>30g</strong><small>450g</small></button>
</div>
</section>

<section class="section">
<h2>焙煎度・湯温</h2>
<div class="grid3" id="roastChoices">
<button class="choice roast" data-roast="light"><strong>浅煎り</strong><span class="temp">93℃</span></button>
<button class="choice roast active" data-roast="medium"><strong>中煎り</strong><span class="temp">88℃</span></button>
<button class="choice roast" data-roast="dark"><strong>深煎り</strong><span class="temp">83℃</span></button>
</div>
</section>

<section class="section grindSection">
<h2>挽き目</h2>
<p class="grindText">中粗〜粗挽き　｜　濃く→細かめ　｜　薄く→粗め</p>
</section>

<section class="section">
<h2>味</h2>
<div class="tasteRow" id="flavorChoices">
<button class="choice" data-flavor="sweet">甘く</button>
<button class="choice active" data-flavor="balanced">バランス</button>
<button class="choice" data-flavor="bright">明るく</button>
</div>
<div class="rangeBox">
<div class="rangeTop"><span>前半40％の配分</span><b id="ratioLabel">50：50</b></div>
<input id="flavorRange" type="range" min="35" max="65" step="1" value="50" aria-label="1投目と2投目の配分">
<p class="rangeHint">1投目 少なめ＝甘く　／　多め＝明るく</p>
</div>
</section>

<section class="section">
<h2>濃さ</h2>
<div class="grid3" id="strengthChoices">
<button class="choice" data-strength="1"><strong>軽め</strong><small>1投</small></button>
<button class="choice active" data-strength="2"><strong>標準</strong><small>2投</small></button>
<button class="choice" data-strength="3"><strong>しっかり</strong><small>3投</small></button>
</div>
</section>

<section class="section">
<div class="recipeHead"><h2>今日のレシピ</h2><div class="recipeMeta"><span id="totalWater">225g</span>・<span id="brewTemp">88℃</span></div></div>
</section>

<section class="timer">
<div class="timerTop"><b>抽出タイマー</b><div class="clock" id="clock">0:00</div></div>
<div class="timerCard" id="timerCard">
<div class="pourDots" id="pourDots"></div>
<div class="timerMain"><div class="stepBadge" id="stepBadge">1</div><div class="timerAmount" id="timerAmount">45g</div></div>
</div>
<div class="actions"><button class="primary" id="startBtn">抽出スタート</button><button id="pauseBtn" disabled>一時停止</button><button id="resetBtn">リセット</button></div>
</section>

<details><summary>4：6メソッドの考え方</summary><div class="detailsBody"><p><b>1.</b> 粉量の15倍のお湯を使います。20gなら300gです。</p><p><b>2.</b> 総湯量を40％と60％に分けます。</p><p><b>3.</b> 最初の40％を2投に分け、1投目と2投目の量で甘さと明るさを調整します。</p><p><b>4.</b> 残り60％は分割回数で濃度を調整します。</p></div></details>
</main>

<script>
const state={beans:15,roast:'medium',flavor:'balanced',strength:2,firstShare:50,elapsed:0,running:false,timer:null,recipe:[],lastStep:0,audioCtx:null};
const roastInfo={light:{temp:93},medium:{temp:88},dark:{temp:83}};
const times=[0,45,90,130,160];
const fmt=n=>Number.isInteger(Math.round(n*10)/10)?String(Math.round(n)):((Math.round(n*10)/10).toFixed(1));
const t=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function active(group,attr,value){$$(group).forEach(b=>b.classList.toggle('active',String(b.dataset[attr])===String(value)))}
function buildRecipe(){
 const total=state.beans*15,front=total*.4,back=total*.6,first=front*(state.firstShare/100),second=front-first,each=back/state.strength;
 const pours=[first,second,...Array(state.strength).fill(each)];let cum=0;
 state.recipe=pours.map((amount,i)=>{cum+=amount;return{idx:i+1,time:times[i],amount,cum}});
 $('#totalWater').textContent=fmt(total)+'g';
 $('#brewTemp').textContent=roastInfo[state.roast].temp+'℃';
 $('#ratioLabel').textContent=`${state.firstShare}：${100-state.firstShare}`;
 active('#beanChoices .choice','beans',state.beans);active('#roastChoices .choice','roast',state.roast);active('#flavorChoices .choice','flavor',state.flavor);active('#strengthChoices .choice','strength',state.strength);
 if(!state.running){state.lastStep=0;updateTimerView(false)}
}
function flavorFromRange(){state.flavor=state.firstShare<47?'sweet':state.firstShare>53?'bright':'balanced'}
function renderDots(current){
 $('#pourDots').innerHTML=state.recipe.map((_,i)=>`<span class="pourDot ${i<current?'done':''} ${i===current?'current':''}"></span>`).join('');
}
function initAudio(){
 try{
  if(!state.audioCtx)state.audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(state.audioCtx.state==='suspended')state.audioCtx.resume();
 }catch(e){}
}
function playPourSound(){
 try{
  if(!state.audioCtx)return;
  const ctx=state.audioCtx,now=ctx.currentTime;
  const osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.type='sine';osc.frequency.setValueAtTime(660,now);osc.frequency.exponentialRampToValueAtTime(880,now+.11);
  gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.18,now+.015);gain.gain.exponentialRampToValueAtTime(.0001,now+.22);
  osc.connect(gain);gain.connect(ctx.destination);osc.start(now);osc.stop(now+.23);
 }catch(e){}
}
function flashStep(){
 const card=$('#timerCard');
 card.classList.remove('alert');void card.offsetWidth;card.classList.add('alert');
 setTimeout(()=>card.classList.remove('alert'),1400);
}
function updateTimerView(withEffect=true){
 $('#clock').textContent=t(state.elapsed);if(!state.recipe.length)return;
 let i=0;for(let x=0;x<state.recipe.length;x++)if(state.elapsed>=state.recipe[x].time)i=x;
 const finalTime=state.recipe[state.recipe.length-1].time+45;
 if(state.elapsed>=finalTime){renderDots(state.recipe.length);$('#stepBadge').textContent='✓';$('#timerAmount').textContent='完成';return}
 const changed=i!==state.lastStep;
 renderDots(i);
 $('#stepBadge').textContent=i+1;
 $('#timerAmount').textContent=fmt(state.recipe[i].amount)+'g';
 if(withEffect&&state.running&&changed){playPourSound();flashStep()}
 state.lastStep=i;
}
function start(){
 if(state.running)return;
 initAudio();state.running=true;$('#startBtn').disabled=true;$('#pauseBtn').disabled=false;$('#startBtn').textContent='抽出中';
 updateTimerView(false);
 state.timer=setInterval(()=>{state.elapsed++;updateTimerView(true)},1000);
}
function stop(resume=true){if(state.timer)clearInterval(state.timer);state.timer=null;state.running=false;$('#startBtn').disabled=false;$('#pauseBtn').disabled=true;$('#startBtn').textContent=resume&&state.elapsed>0?'再開':'抽出スタート'}
function reset(){stop(false);state.elapsed=0;state.lastStep=0;$('#startBtn').textContent='抽出スタート';$('#timerCard').classList.remove('alert');updateTimerView(false)}
$$('#beanChoices .choice').forEach(b=>b.addEventListener('click',()=>{state.beans=+b.dataset.beans;reset();buildRecipe()}));
$$('#roastChoices .choice').forEach(b=>b.addEventListener('click',()=>{state.roast=b.dataset.roast;buildRecipe()}));
$$('#flavorChoices .choice').forEach(b=>b.addEventListener('click',()=>{state.flavor=b.dataset.flavor;state.firstShare=state.flavor==='sweet'?40:state.flavor==='bright'?60:50;$('#flavorRange').value=state.firstShare;reset();buildRecipe()}));
$$('#strengthChoices .choice').forEach(b=>b.addEventListener('click',()=>{state.strength=+b.dataset.strength;reset();buildRecipe()}));
$('#flavorRange').addEventListener('input',e=>{state.firstShare=+e.target.value;flavorFromRange();reset();buildRecipe()});
$('#startBtn').addEventListener('click',start);$('#pauseBtn').addEventListener('click',()=>stop(true));$('#resetBtn').addEventListener('click',reset);
buildRecipe();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
