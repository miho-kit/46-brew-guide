<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ead9c7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Brew Guide"><title>Brew Guide</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet"><link rel="manifest" href="manifest.webmanifest?v=13"><link rel="apple-touch-icon" href="./apple-touch-icon.png?v=13"><style>:root{--bg:#ead9c7;--panel:#fff9f2;--panel2:#f3e5d8;--ink:#3a2418;--muted:#846f60;--line:rgba(111,78,55,.17);--accent:#806047;--deep:#4a2d1f;--cream:#fffdf9;--r:'Zen Maru Gothic',sans-serif;--n:'M PLUS Rounded 1c',sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.38}button,input{font:inherit}button{cursor:pointer}.wrap{width:min(100%,680px);margin:auto;padding:8px 12px 12px}.card,.timer{margin-top:8px;background:var(--panel);border:1px solid rgba(111,78,55,.13);border-radius:16px;padding:12px}.timer{margin-top:0}.settings{border:0}.block+.block{margin-top:8px;padding-top:8px}.block.tasteBlock{margin-top:16px;padding-top:0}.block.strengthBlock{margin-top:8px;padding-top:4px}.block h2,.recipeLabel,summary{font-family:var(--r);font-weight:500;color:#4b2f22}.block h2{font-size:14px;margin:0 0 8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.choice{min-height:44px;border:1px solid var(--line);background:rgba(255,253,249,.7);border-radius:12px;padding:6px;color:var(--ink);transition:.16s ease;box-shadow:none}.choice.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:none}.choice:disabled{opacity:.58;cursor:not-allowed}.bean,.roast{display:flex;align-items:center;justify-content:center;gap:7px;line-height:1}.beanMain,.beanWater,.temp,.recipeMeta,.timerAmount,.clock,.rangeTop b{font-family:var(--n)}.beanMain{font-size:16px;font-weight:800}.beanWater{font-size:12px;color:var(--muted)}.active .beanWater{color:#eadfd5}.roast strong{font-family:var(--r);font-size:12px}.temp{font-size:17px;font-weight:800}.taste .choice,#strengthChoices .choice{font-family:var(--r);font-weight:700}#strengthChoices .choice{display:flex;align-items:center;justify-content:center;white-space:nowrap}#strengthChoices .strengthNote{font-size:.6em;font-weight:500;opacity:.7;white-space:nowrap;margin-left:2px}.grind{font-size:10.5px;color:var(--muted);text-align:center;margin:6px 2px 0;white-space:nowrap}.range{margin-top:7px;padding:0 2px;background:transparent}.rangeTop{display:flex;justify-content:flex-end;align-items:center;font-size:11.5px;padding:0 1px}input[type=range]{width:100%;accent-color:var(--accent);margin:3px 0 1px}input[type=range]:disabled{opacity:.55}.hint{font-size:10px;color:var(--muted);text-align:center;margin:0;letter-spacing:.02em}.recipe{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;background:#f4e5d8;border:0;padding:9px 13px}.recipeLabel{font-size:13px;color:#644b3d}.recipeStyle{font-family:var(--r);text-align:center;font-size:11px;color:#9a8475}.recipeMeta{font-size:19px;font-weight:900;white-space:nowrap;color:#4a2d1f}.timerTitle{font-family:var(--r);font-size:12px;font-weight:500;color:#755d4e;margin-bottom:4px;letter-spacing:.03em}.timerCard{background:var(--panel2);border-radius:14px;padding:8px 14px 12px;text-align:center;transition:.22s}.dots{display:flex;justify-content:center;gap:7px;margin-bottom:4px;transform:translateY(-1px)}.dot{width:7px;height:7px;border-radius:50%;border:1.3px solid var(--accent);transition:.18s}.dot.done{background:var(--accent);opacity:.32}.dot.current{background:var(--accent);transform:scale(1.33)}.readout{display:grid;grid-template-columns:1.08fr .92fr;align-items:center;gap:14px;padding:0 6px}.amountWrap{display:flex;align-items:baseline;justify-content:center;gap:5px;padding-left:12px}.timerStep{font-family:var(--r);font-size:10px;font-weight:500;color:#8d7566;white-space:nowrap}.timerAmount{font-family:var(--n);font-size:36px;line-height:1;font-variant-numeric:tabular-nums;font-weight:900;color:#4b2f22}.clock{font-family:var(--n);font-size:32px;line-height:1;font-variant-numeric:tabular-nums;font-weight:800;color:#71594a;white-space:nowrap}.timerCard.alert{background:var(--accent);transform:scale(1.008)}.timerCard.alert .dot{border-color:#fff}.timerCard.alert .dot.done,.timerCard.alert .dot.current{background:#fff}.timerCard.alert .timerAmount,.timerCard.alert .clock,.timerCard.alert .timerStep{color:#fff}.timerCard.alert .timerAmount{animation:pop .65s}@keyframes pop{0%{transform:scale(.82)}45%{transform:scale(1.14)}100%{transform:scale(1)}}.actions{display:flex;gap:6px;margin-top:8px}.actions button{min-height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(255,253,249,.72);padding:0 11px;font-family:var(--r);font-weight:700;color:var(--ink);box-shadow:none}.actions .primary{flex:1;background:var(--deep);color:#fff;border-color:var(--deep)}.actions button:disabled{color:#c2b7af;background:rgba(255,253,249,.5);border-color:rgba(111,78,55,.1)}#reset{color:#5b4335}.settings details{margin-top:12px;padding:10px 2px 0;border-top:1px solid rgba(111,78,55,.055);background:transparent}.settings summary{font-size:12.5px;list-style:none;cursor:pointer;color:#5c4436}.settings summary::-webkit-details-marker{display:none}.settings summary::before{content:'▶';display:inline-block;margin-right:6px;font-size:10px;transform:translateY(-1px)}.settings details[open] summary::before{content:'▼'}.details{font-size:11px;color:var(--muted);padding:4px 2px 0}.brand{position:relative;min-height:132px;margin-top:0}.brandText{position:absolute;left:6px;top:30px;z-index:2}.sub{font-size:10.5px;color:var(--muted);margin:0}.title{font-family:var(--r);font-size:34px;font-weight:700;margin:0;line-height:.96;white-space:nowrap;color:#4b2f22}.penguin{position:absolute;right:22px;top:-22px;width:162px;filter:drop-shadow(0 5px 4px rgba(75,47,34,.05))}@media(max-width:430px){.wrap{padding:5px 10px 8px}.card,.timer{margin-top:8px;padding:8px 9px;border-radius:14px}.timer{margin-top:0}.recipe{padding:8px 11px}.block+.block{margin-top:8px;padding-top:8px}.block.tasteBlock{margin-top:16px;padding-top:0}.block.strengthBlock{margin-top:8px;padding-top:4px}.block h2{font-size:13px;margin-bottom:6px}.grid3{gap:5px}.choice{min-height:40px;padding:4px;border-radius:11px}.beanMain{font-size:15px}.beanWater{font-size:10.5px}.roast strong{font-size:11px}.temp{font-size:15.5px}.grind{font-size:9.5px}.range{padding:0 2px}.rangeTop{font-size:11px}.recipeLabel{font-size:12px}.recipeStyle{font-size:10px}.recipeMeta{font-size:17px}.timerTitle{font-size:11px;margin-bottom:4px}.timerCard{padding:7px 8px 10px}.dots{gap:6px;margin-bottom:4px}.dot{width:7px;height:7px}.readout{grid-template-columns:1.08fr .92fr;gap:10px;padding:0 4px}.amountWrap{gap:4px;padding-left:10px}.timerStep{font-size:9.5px}.timerAmount{font-size:33px}.clock{font-size:29px}.actions{gap:5px}.actions button{min-height:36px;padding:0 8px;font-size:12.5px}.settings details{margin-top:10px;padding-top:9px}.brand{min-height:124px}.brandText{left:4px;top:28px}.title{font-size:31px}.sub{font-size:10px;margin:0}.penguin{width:154px;right:18px;top:-20px}}@media(max-width:360px){#strengthChoices .choice{font-size:14px}#strengthChoices .strengthNote{margin-left:0}.grind{white-space:normal}.timerAmount{font-size:30px}.clock{font-size:27px}.timerStep{font-size:9px}.title{font-size:29px}.penguin{width:145px;right:15px}}</style></head><body><main class="wrap"><section class="timer"><div class="timerTitle">抽出タイマー</div><div class="timerCard" id="timerCard"><div class="dots" id="dots"></div><div class="readout"><div class="amountWrap"><span class="timerStep" id="timerStep">1投目</span><span class="timerAmount" id="timerAmount">45g</span></div><div class="clock" id="clock">0:00.00</div></div></div><div class="actions"><button class="primary" id="start">抽出スタート</button><button id="pause" disabled>一時停止</button><button id="reset">リセット</button></div></section><section class="card recipe"><div class="recipeLabel">今日のレシピ</div><div class="recipeStyle" id="summary">バランス、基本</div><div class="recipeMeta"><span id="water">225g</span>・<span id="temp">88℃</span></div></section><section class="card settings"><div class="block"><h2>豆量・湯量</h2><div class="grid3" id="beans"><button class="choice bean active" data-v="15"><span class="beanMain">15g</span><span class="beanWater">225g</span></button><button class="choice bean" data-v="20"><span class="beanMain">20g</span><span class="beanWater">300g</span></button><button class="choice bean" data-v="30"><span class="beanMain">30g</span><span class="beanWater">450g</span></button></div></div><div class="block"><h2>焙煎度・湯温</h2><div class="grid3" id="roasts"><button class="choice roast" data-v="light"><strong>浅煎り</strong><span class="temp">93℃</span></button><button class="choice roast active" data-v="medium"><strong>中煎り</strong><span class="temp">88℃</span></button><button class="choice roast" data-v="dark"><strong>深煎り</strong><span class="temp">83℃</span></button></div><p class="grind">挽き目：中粗〜粗｜濃く→細め｜薄く→粗め</p></div><div class="block tasteBlock"><h2>味</h2><div class="grid3 taste" id="flavors"><button class="choice" data-v="sweet">甘く</button><button class="choice active" data-v="balanced">バランス</button><button class="choice" data-v="bright">明るく</button></div><div class="range"><div class="rangeTop"><b id="ratio">50：50</b></div><input id="range" type="range" min="35" max="65" value="50" aria-label="1投目と2投目の比率（甘く〜明るく）"><p class="hint">甘く ←　　　　　→ 明るく</p></div></div><div class="block strengthBlock"><h2>濃さ</h2><div class="grid3" id="strengthChoices"><button class="choice" data-v="1">軽め</button><button class="choice" data-v="2">中間</button><button class="choice active" data-v="3">基本<span class="strengthNote">（しっかり）</span></button></div></div><details><summary>4：6メソッドの考え方</summary><div class="details"><p>1. 粉量の15倍のお湯を使います。20gなら300gです。</p><p>2. 総湯量を40％と60％に分けます。</p><p>3. 最初の40％を2投に分け、1投目と2投目の量で甘さと明るさを調整します。</p><p>4. 残り60％は分割回数で濃度を調整します。</p></div></details></section><footer class="brand"><div class="brandText"><p class="sub">4：6メソッド専用</p><h1 class="title">Brew Guide</h1></div><img class="penguin" src="./penguin-hero-transparent.png?v=2" alt="ペンギンがコーヒーを淹れているイラスト"></footer></main><script>const S={beans:15,roast:'medium',flavor:'balanced',strength:3,share:50,elapsed:0,running:false,timer:null,recipe:[],last:0,audio:null,started:null,wake:null};const R={light:93,medium:88,dark:83},F={sweet:'甘く',balanced:'バランス',bright:'明るく'},ST={1:'軽め',2:'中間',3:'基本'},T=[0,45,90,130,160],$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],fmt=n=>Math.round(n*10)%10?Number(n).toFixed(1):String(Math.round(n));function active(id,v){$$('#'+id+' .choice').forEach(b=>b.classList.toggle('active',b.dataset.v==v))}function lockSettings(locked){$$('#beans .choice,#roasts .choice,#flavors .choice,#strengthChoices .choice').forEach(el=>el.disabled=locked);$('#range').disabled=locked}async function keepAwake(){if(!('wakeLock'in navigator)||S.wake)return;try{S.wake=await navigator.wakeLock.request('screen');S.wake.addEventListener('release',()=>{S.wake=null})}catch(e){S.wake=null}}function releaseWake(){if(!S.wake)return;const lock=S.wake;S.wake=null;lock.release().catch(()=>{})}function build(){let total=S.beans*15,front=total*.4,back=total*.6,a=front*S.share/100,b=front-a,e=back/S.strength,p=[a,b,...Array(S.strength).fill(e)];S.recipe=p.map((amount,i)=>({time:T[i],amount}));$('#water').textContent=total+'g';$('#temp').textContent=R[S.roast]+'℃';$('#ratio').textContent=S.share+'：'+(100-S.share);$('#summary').textContent=F[S.flavor]+'、'+ST[S.strength];active('beans',S.beans);active('roasts',S.roast);active('flavors',S.flavor);active('strengthChoices',S.strength);if(!S.running){S.last=0;view(false)}}function dots(i){$('#dots').innerHTML=S.recipe.map((_,x)=>`<span class="dot ${x<i?'done':''} ${x===i?'current':''}"></span>`).join('')}function clock(ms){let x=Math.max(0,Math.floor(ms/10)),m=Math.floor(x/6000),s=Math.floor((x%6000)/100),c=x%100;return `${m}:${String(s).padStart(2,'0')}.${String(c).padStart(2,'0')}`}function endMs(){return S.recipe.length?(S.recipe.at(-1).time+45)*1000:0}function beep(){try{if(!S.audio)S.audio=new(window.AudioContext||window.webkitAudioContext)();let c=S.audio,n=c.currentTime,o=c.createOscillator(),g=c.createGain();o.frequency.value=760;g.gain.setValueAtTime(.15,n);g.gain.exponentialRampToValueAtTime(.0001,n+.2);o.connect(g);g.connect(c.destination);o.start();o.stop(n+.21)}catch(e){}}function flash(){let c=$('#timerCard');c.classList.remove('alert');void c.offsetWidth;c.classList.add('alert');setTimeout(()=>c.classList.remove('alert'),1000)}function finish(){let end=endMs();clearInterval(S.timer);S.timer=null;S.elapsed=end;S.running=false;S.started=null;lockSettings(false);releaseWake();dots(S.recipe.length);$('#clock').textContent=clock(end);$('#timerStep').textContent='';$('#timerAmount').textContent='完成';$('#start').disabled=false;$('#start').textContent='もう一度';$('#pause').disabled=true}function view(effect=true){$('#clock').textContent=clock(S.elapsed);let sec=S.elapsed/1000,i=0;for(let x=0;x<S.recipe.length;x++)if(sec>=S.recipe[x].time)i=x;if(S.elapsed>=endMs()){if(S.running)finish();else{dots(S.recipe.length);$('#timerStep').textContent='';$('#timerAmount').textContent='完成'}return}let changed=i!==S.last;dots(i);$('#timerStep').textContent=(i+1)+'投目';$('#timerAmount').textContent=fmt(S.recipe[i].amount)+'g';if(effect&&S.running&&changed){beep();flash()}S.last=i}function start(){if(S.running)return;if(S.elapsed>=endMs()){S.elapsed=0;S.last=0}try{if(!S.audio)S.audio=new(window.AudioContext||window.webkitAudioContext)();if(S.audio.state==='suspended')S.audio.resume()}catch(e){}S.running=true;S.started=performance.now()-S.elapsed;lockSettings(true);keepAwake();$('#start').disabled=true;$('#pause').disabled=false;$('#start').textContent='抽出中';view(false);S.timer=setInterval(()=>{S.elapsed=performance.now()-S.started;view(true)},10)}function stop(resume=true){if(S.running)S.elapsed=performance.now()-S.started;clearInterval(S.timer);S.timer=null;S.running=false;S.started=null;lockSettings(false);releaseWake();$('#start').disabled=false;$('#pause').disabled=true;$('#start').textContent=resume&&S.elapsed>0?'再開':'抽出スタート';view(false)}function reset(){if(S.timer)clearInterval(S.timer);S.timer=null;S.running=false;S.started=null;S.elapsed=0;S.last=0;lockSettings(false);releaseWake();$('#start').disabled=false;$('#pause').disabled=true;$('#start').textContent='抽出スタート';view(false)}$$('#beans .choice').forEach(b=>b.onclick=()=>{S.beans=+b.dataset.v;reset();build()});$$('#roasts .choice').forEach(b=>b.onclick=()=>{S.roast=b.dataset.v;reset();build()});$$('#flavors .choice').forEach(b=>b.onclick=()=>{S.flavor=b.dataset.v;S.share=S.flavor==='sweet'?40:S.flavor==='bright'?60:50;$('#range').value=S.share;reset();build()});$$('#strengthChoices .choice').forEach(b=>b.onclick=()=>{S.strength=+b.dataset.v;reset();build()});$('#range').oninput=e=>{S.share=+e.target.value;S.flavor=S.share<47?'sweet':S.share>53?'bright':'balanced';reset();build()};$('#start').onclick=start;$('#pause').onclick=()=>stop(true);$('#reset').onclick=reset;document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.running)keepAwake()});build();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
