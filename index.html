<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ead9c7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Brew Guide">
<title>Brew Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest?v=8">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=8">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="./apple-touch-icon.png?v=8">
<style>
:root{--bg:#ead9c7;--panel:#fff9f2;--panel2:#f4e6d8;--ink:#3a2418;--muted:#7a6253;--line:#d4bda9;--accent:#6f4e37;--accent-dark:#4b2f22;--accent-deep:#4a2d1f;--cream:#fffdf9;--radius:15px;--round:'Zen Maru Gothic',-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.38}
button,input{font:inherit}button{cursor:pointer}
.wrap{width:min(100%,680px);margin:0 auto;padding:8px 12px 10px}
.settingsCard,.recipeCard,.timer,details{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:11px}
.timer{margin-top:0;padding:11px}
.settingBlock + .settingBlock{margin-top:10px;padding-top:10px}
.settingBlock h2{font-family:var(--round);font-size:14px;font-weight:700;margin:0 0 7px;color:var(--accent-dark)}
.grid3,.tasteRow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.choice{min-height:44px;border:1px solid var(--line);background:var(--cream);border-radius:11px;padding:6px;color:var(--ink)}
.choice.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.choice strong{font-size:16px;display:block}.choice small{display:block;font-size:10px;color:var(--muted);margin-top:1px}.choice.active small{color:#eadfd5}
.beanChoice{display:flex;align-items:center;justify-content:center;gap:7px;min-height:42px;line-height:1}.beanMain{font-size:16px;font-weight:800}.beanWater{font-size:12px;color:var(--muted)}.choice.active .beanWater{color:#e8d8ca}
.roast{display:flex;align-items:center;justify-content:center;gap:6px;line-height:1}.roast strong{font-family:var(--round);font-size:12px;font-weight:700;display:inline;margin:0;line-height:1}.roast .temp{font-size:17px;font-weight:800;display:inline;line-height:1;margin:0}
.tasteRow .choice{font-family:var(--round);font-weight:700}
#strengthChoices .choice strong{font-family:var(--round);font-weight:700}
.grindNote{font-size:10.5px;color:var(--muted);margin:6px 2px 0;text-align:center;white-space:nowrap}
.rangeBox{margin-top:6px;border:1px solid var(--line);border-radius:11px;padding:6px 8px 5px;background:#fffaf5}.rangeTop{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11.5px}input[type=range]{width:100%;accent-color:var(--accent);margin:5px 0 0}.rangeHint{font-size:10px;color:var(--muted);margin:0;text-align:center}
.recipeRowSummary{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}.recipeLabel{font-family:var(--round);font-size:14px;font-weight:700;color:var(--accent-dark)}.recipeStyle{text-align:center;font-family:var(--round);font-size:12.5px;font-weight:500;color:var(--muted)}.recipeMeta{font-size:19px;font-weight:900;color:var(--accent-dark);white-space:nowrap}
.timerTitle{font-family:var(--round);font-size:14px;font-weight:700;color:var(--accent-dark);margin-bottom:5px}.timerCard{background:var(--panel2);border-radius:11px;padding:11px 14px 12px;text-align:center;transition:background .22s ease,color .22s ease,transform .22s ease;overflow:hidden}.pourDots{display:flex;justify-content:center;gap:9px;margin-bottom:8px}.pourDot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;transition:transform .2s ease,background .2s ease,border-color .2s ease,opacity .2s ease}.pourDot.done{background:var(--accent);opacity:.42}.pourDot.current{background:var(--accent);transform:scale(1.42);opacity:1}.timerReadout{display:flex;align-items:baseline;justify-content:space-between;gap:18px;padding:0 14px}.timerAmount{font-size:36px;line-height:1;font-weight:900;color:var(--accent-dark);font-variant-numeric:tabular-nums;transition:color .2s ease,transform .2s ease}.clock{font-size:20px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;transition:color .22s ease}
.timerCard.alert{background:var(--accent);color:#fff;transform:scale(1.015)}.timerCard.alert .pourDot{border-color:#fff}.timerCard.alert .pourDot.done,.timerCard.alert .pourDot.current{background:#fff}.timerCard.alert .timerAmount{color:#fff;animation:amountPop .65s ease}.timerCard.alert .clock{color:#f2e8df}@keyframes amountPop{0%{transform:scale(.82)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
.actions{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}.actions button{min-height:40px;border-radius:11px;border:1px solid var(--line);background:var(--cream);color:var(--ink);padding:0 11px;font-family:var(--round);font-weight:700}.actions .primary{flex:1;background:var(--accent-deep);color:#fff;border-color:var(--accent-deep)}
details{padding:10px 11px;position:relative;z-index:1}summary{font-family:var(--round);font-weight:700;font-size:13px;color:var(--accent-dark);cursor:pointer}.detailsBody{font-size:11px;color:var(--muted);margin-top:6px}.detailsBody p{margin:5px 0}
.brandFooter{position:relative;min-height:150px;margin-top:0;padding:0 6px}.brandText{position:absolute;left:6px;bottom:28px;z-index:2}.title{font-family:var(--round);font-size:50px;font-weight:700;margin:0;color:var(--accent-dark);letter-spacing:-.02em;line-height:.95;white-space:nowrap}.sub{font-size:12px;color:var(--muted);margin:0 0 7px}.heroArt{position:absolute;right:-4px;top:-36px;width:178px;height:auto;object-fit:contain;z-index:3;filter:drop-shadow(0 5px 4px rgba(75,47,34,.07))}
@media(max-width:430px){
 .wrap{padding:5px 10px 8px}
 .settingsCard,.recipeCard,.timer,details{margin-top:5px;padding:8px 9px;border-radius:13px}.timer{margin-top:0}
 .settingBlock + .settingBlock{margin-top:8px;padding-top:8px}.settingBlock h2{font-size:13px;margin:0 0 5px}
 .grid3,.tasteRow{gap:5px}.choice{min-height:40px;border-radius:9px;padding:4px}.beanChoice{min-height:38px;gap:6px}.beanMain{font-size:15px}.beanWater{font-size:10.5px}.choice strong{font-size:15px}.choice small{font-size:9px;margin-top:0}.roast{gap:5px}.roast strong{font-size:11px}.roast .temp{font-size:15.5px}.grindNote{font-size:9.5px;margin-top:5px}.rangeBox{margin-top:5px;border-radius:9px;padding:4px 7px 3px}.rangeTop{font-size:11px}input[type=range]{margin:3px 0 0}.rangeHint{font-size:9.5px}
 .recipeRowSummary{gap:8px}.recipeLabel{font-size:13px}.recipeStyle{font-size:11.5px}.recipeMeta{font-size:17px}
 .timerTitle{font-size:13px;margin-bottom:4px}.timerCard{border-radius:9px;padding:9px 8px 10px}.pourDots{gap:7px;margin-bottom:7px}.pourDot{width:8px;height:8px}.timerReadout{padding:0 12px;gap:12px}.timerAmount{font-size:33px}.clock{font-size:18px}.actions{gap:5px;margin-top:5px;flex-wrap:nowrap}.actions button{min-height:36px;border-radius:9px;padding:0 8px;font-size:12.5px}.actions .primary{min-width:0}
 details{padding:8px 9px}summary{font-size:12px}.detailsBody{font-size:10px;margin-top:4px}
 .brandFooter{min-height:142px;padding:0 4px}.brandText{left:4px;bottom:24px}.title{font-size:46px}.sub{font-size:11px;margin:0 0 6px}.heroArt{width:166px;right:-5px;top:-34px}
}
@media(max-width:360px){.choice{padding:3px 2px}.grindNote{white-space:normal}.recipeRowSummary{gap:6px}.recipeMeta{font-size:16px}.recipeStyle{font-size:11px}.timerReadout{padding:0 8px}.timerAmount{font-size:31px}.clock{font-size:17px}.brandFooter{min-height:132px}.brandText{bottom:20px}.title{font-size:42px}.heroArt{width:154px;top:-30px}}
</style>
</head>
<body>
<main class="wrap">
<section class="timer"><div class="timerTitle">抽出タイマー</div><div class="timerCard" id="timerCard"><div class="pourDots" id="pourDots"></div><div class="timerReadout"><div class="timerAmount" id="timerAmount">45g</div><div class="clock" id="clock">0:00:00</div></div></div><div class="actions"><button class="primary" id="startBtn">抽出スタート</button><button id="pauseBtn" disabled>一時停止</button><button id="resetBtn">リセット</button></div></section>
<section class="recipeCard"><div class="recipeRowSummary"><div class="recipeLabel">今日のレシピ</div><div class="recipeStyle" id="recipeChoiceSummary">バランス、標準</div><div class="recipeMeta"><span id="totalWater">225g</span>・<span id="brewTemp">88℃</span></div></div></section>
<section class="settingsCard">
<div class="settingBlock"><h2>豆量・湯量</h2><div class="grid3" id="beanChoices"><button class="choice beanChoice active" data-beans="15"><span class="beanMain">15g</span><span class="beanWater">225g</span></button><button class="choice beanChoice" data-beans="20"><span class="beanMain">20g</span><span class="beanWater">300g</span></button><button class="choice beanChoice" data-beans="30"><span class="beanMain">30g</span><span class="beanWater">450g</span></button></div></div>
<div class="settingBlock"><h2>焙煎度・湯温</h2><div class="grid3" id="roastChoices"><button class="choice roast" data-roast="light"><strong>浅煎り</strong><span class="temp">93℃</span></button><button class="choice roast active" data-roast="medium"><strong>中煎り</strong><span class="temp">88℃</span></button><button class="choice roast" data-roast="dark"><strong>深煎り</strong><span class="temp">83℃</span></button></div><p class="grindNote">挽き目：中粗〜粗｜濃く→細め｜薄く→粗め</p></div>
<div class="settingBlock"><h2>味</h2><div class="tasteRow" id="flavorChoices"><button class="choice" data-flavor="sweet">甘く</button><button class="choice active" data-flavor="balanced">バランス</button><button class="choice" data-flavor="bright">明るく</button></div><div class="rangeBox"><div class="rangeTop"><span>前半40％の配分</span><b id="ratioLabel">50：50</b></div><input id="flavorRange" type="range" min="35" max="65" step="1" value="50" aria-label="1投目と2投目の配分"><p class="rangeHint">少なめ＝甘く　／　多め＝明るく</p></div></div>
<div class="settingBlock"><h2>濃さ</h2><div class="grid3" id="strengthChoices"><button class="choice" data-strength="1"><strong>軽め</strong><small>1投</small></button><button class="choice active" data-strength="2"><strong>標準</strong><small>2投</small></button><button class="choice" data-strength="3"><strong>しっかり</strong><small>3投</small></button></div></div>
</section>
<details><summary>4：6メソッドの考え方</summary><div class="detailsBody"><p><b>1.</b> 粉量の15倍のお湯を使います。20gなら300gです。</p><p><b>2.</b> 総湯量を40％と60％に分けます。</p><p><b>3.</b> 最初の40％を2投に分け、1投目と2投目の量で甘さと明るさを調整します。</p><p><b>4.</b> 残り60％は分割回数で濃度を調整します。</p></div></details>
<footer class="brandFooter"><div class="brandText"><p class="sub">4：6メソッド専用</p><h1 class="title">Brew Guide</h1></div><img class="heroArt" src="./penguin-hero-transparent.png?v=2" alt="ペンギンが手淹れコーヒーを淹れているイラスト"></footer>
</main>
<script>
const state={beans:15,roast:'medium',flavor:'balanced',strength:2,firstShare:50,elapsed:0,running:false,timer:null,recipe:[],lastStep:0,audioCtx:null};
const roastInfo={light:{temp:93},medium:{temp:88},dark:{temp:83}};
const labelMap={flavor:{sweet:'甘く',balanced:'バランス',bright:'明るく'},strength:{1:'軽め',2:'標準',3:'しっかり'}};
const times=[0,45,90,130,160];
const fmt=n=>Number.isInteger(Math.round(n*10)/10)?String(Math.round(n)):((Math.round(n*10)/10).toFixed(1));
const t=s=>{const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function active(group,attr,value){$$(group).forEach(b=>b.classList.toggle('active',String(b.dataset[attr])===String(value)))}
function buildRecipe(){const total=state.beans*15,front=total*.4,back=total*.6,first=front*(state.firstShare/100),second=front-first,each=back/state.strength;const pours=[first,second,...Array(state.strength).fill(each)];let cum=0;state.recipe=pours.map((amount,i)=>{cum+=amount;return{idx:i+1,time:times[i],amount,cum}});$('#totalWater').textContent=fmt(total)+'g';$('#brewTemp').textContent=roastInfo[state.roast].temp+'℃';$('#ratioLabel').textContent=`${state.firstShare}：${100-state.firstShare}`;$('#recipeChoiceSummary').textContent=`${labelMap.flavor[state.flavor]}、${labelMap.strength[state.strength]}`;active('#beanChoices .choice','beans',state.beans);active('#roastChoices .choice','roast',state.roast);active('#flavorChoices .choice','flavor',state.flavor);active('#strengthChoices .choice','strength',state.strength);if(!state.running){state.lastStep=0;updateTimerView(false)}}
function flavorFromRange(){state.flavor=state.firstShare<47?'sweet':state.firstShare>53?'bright':'balanced'}
function renderDots(current){$('#pourDots').innerHTML=state.recipe.map((_,i)=>`<span class="pourDot ${i<current?'done':''} ${i===current?'current':''}"></span>`).join('')}
function initAudio(){try{if(!state.audioCtx)state.audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(state.audioCtx.state==='suspended')state.audioCtx.resume()}catch(e){}}
function playPourSound(){try{if(!state.audioCtx)return;const ctx=state.audioCtx,now=ctx.currentTime;const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(660,now);osc.frequency.exponentialRampToValueAtTime(880,now+.11);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.18,now+.015);gain.gain.exponentialRampToValueAtTime(.0001,now+.22);osc.connect(gain);gain.connect(ctx.destination);osc.start(now);osc.stop(now+.23)}catch(e){}}
function flashStep(){const card=$('#timerCard');card.classList.remove('alert');void card.offsetWidth;card.classList.add('alert');setTimeout(()=>card.classList.remove('alert'),1400)}
function updateTimerView(withEffect=true){$('#clock').textContent=t(state.elapsed);if(!state.recipe.length)return;let i=0;for(let x=0;x<state.recipe.length;x++)if(state.elapsed>=state.recipe[x].time)i=x;const finalTime=state.recipe[state.recipe.length-1].time+45;if(state.elapsed>=finalTime){renderDots(state.recipe.length);$('#timerAmount').textContent='完成';return}const changed=i!==state.lastStep;renderDots(i);$('#timerAmount').textContent=fmt(state.recipe[i].amount)+'g';if(withEffect&&state.running&&changed){playPourSound();flashStep()}state.lastStep=i}
function start(){if(state.running)return;initAudio();state.running=true;$('#startBtn').disabled=true;$('#pauseBtn').disabled=false;$('#startBtn').textContent='抽出中';updateTimerView(false);state.timer=setInterval(()=>{state.elapsed++;updateTimerView(true)},1000)}
function stop(resume=true){if(state.timer)clearInterval(state.timer);state.timer=null;state.running=false;$('#startBtn').disabled=false;$('#pauseBtn').disabled=true;$('#startBtn').textContent=resume&&state.elapsed>0?'再開':'抽出スタート'}
function reset(){stop(false);state.elapsed=0;state.lastStep=0;$('#startBtn').textContent='抽出スタート';$('#timerCard').classList.remove('alert');updateTimerView(false)}
$$('#beanChoices .choice').forEach(b=>b.addEventListener('click',()=>{state.beans=+b.dataset.beans;reset();buildRecipe()}));
$$('#roastChoices .choice').forEach(b=>b.addEventListener('click',()=>{state.roast=b.dataset.roast;buildRecipe()}));
$$('#flavorChoices .choice').forEach(b=>b.addEventListener('click',()=>{state.flavor=b.dataset.flavor;state.firstShare=state.flavor==='sweet'?40:state.flavor==='bright'?60:50;$('#flavorRange').value=state.firstShare;reset();buildRecipe()}));
$$('#strengthChoices .choice').forEach(b=>b.addEventListener('click',()=>{state.strength=+b.dataset.strength;reset();buildRecipe()}));
$('#flavorRange').addEventListener('input',e=>{state.firstShare=+e.target.value;flavorFromRange();reset();buildRecipe()});
$('#startBtn').addEventListener('click',start);$('#pauseBtn').addEventListener('click',()=>stop(true));$('#resetBtn').addEventListener('click',reset);
buildRecipe();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
